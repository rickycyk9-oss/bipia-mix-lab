<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="BIPIA 中英混合提示注入实验工作台，审核语言变体、连接模型、运行实验与分析结果。">
  <meta name="theme-color" content="#7561d4">
  <title>BIPIA Lab · 中英混合实验工作台</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.mjs"></script>
<style>
.sidebar nav a.ws-open {display:flex;align-items:center;gap:12px;box-sizing:border-box;background:#f1edff;color:#513ca0;border:1px solid #d7cef6;font-weight:650;text-decoration:none;}
.sidebar nav a.ws-open:hover,.sidebar nav a.ws-open:focus-visible {background:#e6dffd;outline:2px solid #7561d4;outline-offset:-2px;}
</style></head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div id="app"><main style="max-width:44rem;margin:10vh auto;padding:1.5rem;font:1rem/1.7 system-ui"><p>BIPIA Lab · Word Studio</p><h1>中英词汇工作台 / Word Studio</h1><p>选择界面语言，打开随机词汇翻译。<br>Choose a language to open the word translation page.</p><p><a href="./translator.html?lang=zh">中文 · 随机词汇翻译</a>　<a href="./translator.html?lang=en" lang="en">English · Word translation</a></p></main></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="modal" aria-label="工作台操作"></dialog>
<script>
(() => {
  const root = document.getElementById('app');
  function sync() {
    const nav = root.querySelector('.sidebar nav');
    if (!nav) return;
    const english = document.documentElement.lang.toLowerCase().startsWith('en');
    const url = './translator.html?lang=' + (english ? 'en' : 'zh');
    const label = english ? 'Word translation' : '随机词汇翻译';
    let a = nav.querySelector('a[href*="translator.html"]');
    if (!a) a = document.createElement('a');
    a.classList.add('nav-item','ws-open');
    const review = nav.querySelector('[data-view="review"]');
    if (review && review.nextElementSibling !== a) review.after(a);
    else if (!a.isConnected) nav.appendChild(a);
    if (!a.querySelector('.ws-label')) {
      a.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h12M9 3v2m3 0c-1 4-4 7-8 9m2-6c1 2 3 4 6 6m1 6 4-10h1l4 10m-7-3h5"/></svg><span class="ws-label"></span>';
    }
    if (a.getAttribute('href') !== url) a.setAttribute('href', url);
    const span = a.querySelector('.ws-label');
    if (span.textContent !== label) span.textContent = label;
    let room = nav.querySelector('a[data-study-room]');
    if (!room) { room=document.createElement('a'); room.dataset.studyRoom='1'; room.className='nav-item ws-open'; }
    if(a.nextElementSibling!==room) a.after(room);
    const dest='./study-room.html?lang='+(english?'en':'zh');
    if(room.getAttribute('href')!==dest) room.setAttribute('href',dest);
    const title=english?'Study workspace':'实验工作区';
    if(room.textContent!==title) room.textContent=title;

  }
  new MutationObserver(sync).observe(root,{childList:true,subtree:true});
  new MutationObserver(sync).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
  sync();
})();
</script>
</body>
</html>
