const entries = [
  ['kites', 'Bright kites float above green fields.', ['明亮的','风筝','飘浮','在……上方','绿色的','田野']],
  ['market', 'Red apples fill two baskets.', ['红色的','苹果','装满','两个','篮子']],
  ['morning', 'Small birds sing beside the lake.', ['小小的','鸟儿','歌唱','在……旁边','那片','湖']],
  ['autumn', 'Autumn leaves drift across quiet streets.', ['秋天的','树叶','飘过','穿过','安静的','街道']],
  ['rain', 'Soft rain taps on the window.', ['轻柔的','雨','轻敲','在……上','那扇','窗户']],
  ['clouds', 'Clouds gather, then slowly drift apart.', ['云朵','聚拢','随后','缓缓地','飘动','分开']],
  ['snow', 'Snow melts; snow returns.', ['雪','融化','雪','再来']],

];
// Each item is an occurrence. Repeated words are never collapsed during sampling.
const catalog = entries.map(([id,text,glosses])=>{
  const words = [...text.matchAll(/[A-Za-z]+(?:['’][A-Za-z]+)*/g)].map((m,i)=>({english:m[0],start:m.index,end:m.index+m[0].length,gloss:glosses[i]}));
  if (glosses.length!==words.length || words.length<2) throw new Error('Invalid lesson catalog');
  return {id,text,words};
});
const UINT_RANGE = 0x100000000;
function generator(seed) { // Mulberry32: versioned so old seed/selection pairs stay reproducible.
  let s=seed;
  return ()=>{s=(s+0x6d2b79f5)>>>0; let t=Math.imul(s^(s>>>15),s|1); t^=t+Math.imul(t^(t>>>7),t|61); return (t^(t>>>14))>>>0;};
}
function below(n,next) {const cap=UINT_RANGE-(UINT_RANGE%n); let x; do{x=next();}while(x>=cap); return x%n;}
function pick(n,seed) {
  const next=generator(seed), k=1+below(n-1,next), indexes=Array.from({length:n},(_,i)=>i);
  for(let i=0;i<k;i++){const j=i+below(n-i,next); [indexes[i],indexes[j]]=[indexes[j],indexes[i]];}
  return indexes.slice(0,k).sort((a,b)=>a-b);
}

function render(){document.documentElement.lang=lang==='en'?'en':'zh-CN';document.title=t('title')+' · Word Studio';document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));for(const l of ['zh','en'])$(l).setAttribute('aria-pressed',String(l===lang));$('seed').placeholder=t('placeholder');const local=state.catalog?.standalone;const b=$('workspace');b.href=local?'./?lang='+lang:'./?lang='+lang;b.setAttribute('aria-label',t(local?'standalone':'goBack'));$('brand').textContent=local?'Word Studio':'BIPIA Lab';
  const g=source()==='google',enabled=!!state.catalog?.google_available;$('provider-hint').textContent=t(g?(enabled?'googleOn':'googleOff'):'glossHint');$('token-row').hidden=!g||!enabled;$('token').required=g&&enabled;$('draw-label').textContent=t(state.busy?'working':g?'drawGoogle':'draw');$('draw').disabled=state.busy||!state.catalog||(g&&!enabled);$('reuse').disabled=state.busy;for(const e of [$('sentence'),$('seed'),$('token'),...document.querySelectorAll('[name=provider]')])e.disabled=state.busy||!state.catalog;
  $('notice').textContent=state.notice?t(state.notice):'';$('notice').dataset.error=String(state.error);resultView();
}
function reset(){state.result=null;state.notice='';state.error=false;render();}
function notify(k,error=false){state.notice=k;state.error=error;render();}
async function draw(){if(state.busy||!state.catalog)return;const provider=source();if(provider==='google'&&!state.catalog.google_available){notify('google_not_configured',true);return;}const input=$('seed').value.trim();if(input&&(!/^\d{1,10}$/.test(input)||Number(input)>4294967295)){notify('bad_seed',true);return;}const headers={'Content-Type':'application/json'};if(provider==='google'){if(!$('token').value.trim()){notify('missingToken',true);return;}headers.Authorization='Bearer '+$('token').value.trim();}
 state.busy=true;state.result=null;state.notice='';state.error=false;render();
 try{const payload={sentence_id:$('sentence').value,provider};if(input)payload.seed=Number(input);const row=catalog.find(s=>s.id===payload.sentence_id),seed=payload.seed??crypto.getRandomValues(new Uint32Array(1))[0],selected=pick(row.words.length,seed).map(i=>{const w=row.words[i];return {position:i+1,start:w.start,end:w.end,english:w.english,chinese:w.gloss}});state.result={original:row.text,seed,selected,word_count:row.words.length,selected_count:selected.length,provider:'glossary'};state.notice='done';}catch{state.notice='net';state.error=true;}finally{state.busy=false;render();}}
for(const l of ['en','zh'])$(l).addEventListener('click',()=>{lang=l;try{localStorage.setItem('bipia-lab-language',lang)}catch{}const u=new URL(location.href);u.searchParams.set('lang',lang);history.replaceState(null,'',u);render();});
$('settings').addEventListener('submit',e=>{e.preventDefault();void draw();});$('sentence').addEventListener('change',reset);for(const r of document.querySelectorAll('[name=provider]'))r.addEventListener('change',reset);$('seed').addEventListener('input',reset);$('reuse').addEventListener('click',()=>{if(state.result){$('seed').value=String(state.result.seed);notify('copied');}});
render();
try{const c={sentences:catalog,google_available:false};if(!Array.isArray(c.sentences)||!c.sentences.length)throw new Error();state.catalog=c;for(const s of c.sentences){const o=element('option',s.text);o.value=s.id;$('sentence').append(o);}render();await draw();}catch{notify('loadFail',true);}
</script></body></html>
